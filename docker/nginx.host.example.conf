# ─────────────────────────────────────────────────────────────────────────────
# kremacia.drivko.shop – nginx na hostu, PHP-FPM v kontejneru na 127.0.0.1:9001
#
# Certifikát:  certbot --nginx -d kremacia.drivko.shop
# Catch-all default_server blok už má e-shop, tady se nepřidává.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name kremacia.drivko.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kremacia.drivko.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name kremacia.drivko.shop;

    ssl_certificate     /etc/letsencrypt/live/kremacia.drivko.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kremacia.drivko.shop/privkey.pem;

    root /srv/drivko-kremacia/public;
    index index.php;

    # Musí pokrýt součet fotek v jednom odeslání (až 10 fotek z telefonu).
    client_max_body_size 510M;

    # Interní aplikace – do vyhledávačů nepatří
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        # PHP-FPM běží v kontejneru – cesta musí být ta uvnitř kontejneru
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Fotky se NEservírují přímo – leží v storage/app/private a vydává je
    # aplikace jen přihlášeným uživatelům.

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
