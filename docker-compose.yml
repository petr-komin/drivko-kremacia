# Lokální vývoj: aplikace na http://localhost:8081
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kremacia_app
    restart: unless-stopped
    # Lokálně pod uživatelem hostu – jinak www-data nezapíše do storage/ a .env
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - kremacia

  nginx:
    image: nginx:alpine
    container_name: kremacia_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kremacia

  db:
    image: postgres:16-alpine
    container_name: kremacia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kremacia
      POSTGRES_USER: kremacia
      POSTGRES_PASSWORD: secret
    volumes:
      - kremacia_db:/var/lib/postgresql/data
    networks:
      - kremacia

volumes:
  kremacia_db:

networks:
  kremacia:
    driver: bridge
